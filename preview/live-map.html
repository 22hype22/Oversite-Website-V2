<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oversite Live Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap">
<style>
  :root{
    --bg:#0B0B0C;
    --glass:rgba(13,13,15,.58);
    --glass2:rgba(20,20,23,.6);
    --sel:rgba(58,58,63,.82);
    --hair:rgba(240,242,245,.08);
    --hair2:rgba(240,242,245,.14);
    --ink:#F0F2F5;
    --dim:#8C9098;
    --faint:#5B5F66;
    --amber:#E9A24C;
    --red:#E24B4B;
    --green:#46D07C;
    --blue:#4C8DFF;
    --lime:#B8D94A;
    --blur:blur(40px) saturate(1.25);
    --f:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
    --barh:58px;
    --rail:clamp(330px,26vw,392px);
    --footh:clamp(160px,20vh,196px);
    --gap:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);
    font-size:12.5px;line-height:1.4;-webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;overflow:hidden;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  :focus-visible{outline:1px solid var(--amber);outline-offset:2px}
  svg{display:block}

  /* ───────── the map: full-bleed, under everything ───────── */
  .view{position:fixed;inset:0;z-index:0;background:#0D0F12;overflow:hidden;cursor:grab;touch-action:none}
  .view.drag{cursor:grabbing}
  .world{position:absolute;left:0;top:0;width:2000px;height:2000px;transform-origin:0 0;will-change:transform}
  .world img{position:absolute;inset:0;width:100%;height:100%;user-select:none;-webkit-user-drag:none;
    filter:saturate(1.08) brightness(1.18)}
  body.theme-light .world img{filter:saturate(1.02) brightness(.92)}
  body.theme-dark .world img{filter:none}
  .world svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .route{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .route.a{stroke:#F0F2F5;stroke-width:2.2;stroke-dasharray:9 7;opacity:.9}
  .route.a2{stroke:#F0F2F5;stroke-width:7;opacity:.10}
  .route.b{stroke:var(--lime);stroke-width:2.4;opacity:.92}
  .route.b2{stroke:var(--lime);stroke-width:9;opacity:.12}
  .stop{fill:#0B0B0C;stroke:#F0F2F5;stroke-width:2;vector-effect:non-scaling-stroke}
  .stop.g{stroke:var(--lime)}
  .vig{position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(90deg,rgba(11,11,12,.28) 0,rgba(11,11,12,0) var(--rail)),
      linear-gradient(180deg,rgba(11,11,12,.18),rgba(11,11,12,0) 18%,rgba(11,11,12,0) 78%,rgba(11,11,12,.28))}

  /* screen-space pins re-projected by JS */
  .pins{position:fixed;inset:0;z-index:2;pointer-events:none}
  .pin{position:absolute;transform:translate(-50%,-50%)}
  .veh-dot{width:14px;height:14px;border-radius:50%;background:var(--blue);
    box-shadow:0 0 0 3px rgba(76,141,255,.22),0 0 0 1px #0B0B0C inset}
  .veh-dot.red{background:var(--red);box-shadow:0 0 0 3px rgba(226,75,75,.22)}
  .veh-dot.amber{background:var(--amber);box-shadow:0 0 0 3px rgba(233,162,76,.22)}
  .pin.call .veh-dot{width:10px;height:10px;animation:blink 1.6s ease-in-out infinite}
  .veh-dot.dim{background:#C9CDD3;width:11px;height:11px;box-shadow:0 0 0 1px #0B0B0C inset}
  .focus{width:78px;height:78px;border-radius:50%;
    border:1px solid rgba(240,242,245,.5);background:rgba(240,242,245,.05);
    display:flex;align-items:center;justify-content:center;position:relative}
  .focus::before{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid rgba(240,242,245,.35);
    animation:pulse 2.4s cubic-bezier(.32,.72,0,1) infinite}
  .focus .nav{width:30px;height:30px;border-radius:50%;background:#F0F2F5;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(0,0,0,.45)}
  @keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.75);opacity:0}}
  .tip{position:absolute;transform:translate(-100%,14px);pointer-events:auto;
    background:var(--glass2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border:1px solid var(--hair2);border-radius:10px;padding:10px 12px;min-width:132px;
    box-shadow:0 14px 40px rgba(0,0,0,.45)}
  .tip .k{font-size:12px;color:var(--ink)}
  .tip .s{font-size:10.5px;color:var(--dim);margin-top:1px}
  .tip .v{font-size:22px;font-weight:300;letter-spacing:-.02em;margin-top:6px}
  .tip .v small{font-size:11px;color:var(--dim);margin-left:2px}

  /* ───────── top bar ───────── */
  .bar{position:fixed;top:0;left:0;right:0;height:var(--barh);z-index:6;
    display:flex;align-items:center;gap:20px;padding:0 18px;
    background:none;border:0;pointer-events:none}
  .bar>*{pointer-events:auto}
  .bar .menu button{text-shadow:0 1px 8px rgba(0,0,0,.6)}
  .mark{flex:none;width:30px;height:30px;border-radius:8px;background:rgba(28,28,31,.66);border:1px solid var(--hair);
    display:flex;align-items:center;justify-content:center}
  .menu{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
  .menu::-webkit-scrollbar{display:none}
  .menu button{font-size:12.5px;color:var(--dim);white-space:nowrap;padding:7px 12px;border-radius:999px;border:1px solid transparent;
    transition:color .18s cubic-bezier(.32,.72,0,1),background .18s cubic-bezier(.32,.72,0,1)}
  .menu button:hover{color:var(--ink);background:rgba(240,242,245,.05)}
  .menu button[aria-selected="true"]{background:rgba(28,28,31,.72);color:var(--ink);font-weight:500;border:1px solid var(--hair2);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:0 6px 20px rgba(0,0,0,.35)}
  .search{flex:none;display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12px;
    padding:7px 12px;min-width:190px;border-radius:999px;background:rgba(28,28,31,.66);border:1px solid var(--hair);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
  .search kbd{font:inherit;font-size:10.5px;color:var(--faint);margin-left:auto}
  .icons{flex:none;display:flex;align-items:center;gap:4px}
  .icons button{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--dim);position:relative;
    background:rgba(28,28,31,.66);border:1px solid var(--hair);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
  .icons button:hover{color:var(--ink);background:rgba(240,242,245,.06)}
  .icons .dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--red);
    box-shadow:0 0 0 2px #1C1C1F}
  .avatar{width:30px;height:30px;border-radius:50%;margin-left:6px;
    background:radial-gradient(circle at 35% 30%,#7C7F86,#2A2B2F 70%);border:1px solid var(--hair2)}

  /* ───────── left rail ───────── */
  .rail{position:fixed;top:var(--barh);left:0;bottom:0;width:var(--rail);z-index:5;
    padding:var(--gap);overflow-y:auto;scrollbar-width:none;
    display:flex;flex-direction:column;gap:10px}
  .rail::-webkit-scrollbar{display:none}
  .card{background:var(--glass);box-shadow:0 10px 40px rgba(0,0,0,.28);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border:1px solid var(--hair);border-radius:14px}
  .chips{display:flex;gap:6px}
  .chips button{flex:1;display:flex;align-items:baseline;justify-content:center;gap:5px;
    padding:9px 6px;border-radius:999px;background:var(--glass);border:1px solid var(--hair);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);font-size:11.5px;color:var(--dim);white-space:nowrap;
    transition:border-color .18s,color .18s}
  .chips button b{font-weight:500;color:var(--ink)}
  .chips button:hover{border-color:var(--hair2);color:var(--ink)}
  .chips button[aria-pressed="true"]{border-color:var(--hair2);color:var(--ink)}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .stat{padding:14px 14px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;min-height:74px}
  .stat .l{display:flex;flex-direction:column;gap:12px;color:var(--dim);font-size:11.5px}
  .stat .l svg{display:block}
  .stat .n{font-size:26px;font-weight:300;letter-spacing:-.02em;line-height:1}

  .eff{padding:14px 14px 10px}
  .card h3{margin:0;font-size:12px;font-weight:400;color:var(--dim);display:flex;align-items:center;justify-content:space-between}
  .card h3 .go{color:var(--faint)}
  .eff .big{font-size:30px;font-weight:300;letter-spacing:-.03em;line-height:1;margin-top:10px}
  .eff .big .d{color:var(--dim)}
  .eff .big .d{color:var(--dim)}
  .eff .big .d{color:var(--dim)}
  .eff .big .d{color:var(--dim)}
  .eff .big .d{color:var(--dim)}
  .eff .big .d{color:var(--dim)}

  .eff .big .d{color:var(--dim)}
  .eff .big .d{color:var(--dim)}
  .eff .big .d{color:var(--dim)}
  .eff .big .d{color:var(--dim)}
  .eff .big .d{color:var(--dim)}
  .eff .big .d{color:var(--dim)}
  .eff .big .d{color:var(--dim)}
  .eff .big .d{color:var(--dim)}
  .eff .big .d{color:var(--dim)}
  .eff .big .d{color:var(--dim)}
  .eff .big .d{color:var(--dim)}
  .eff .big .d{color:var(--dim)}
  .eff .big small{font-size:12px;color:var(--dim);margin-left:3px;letter-spacing:0}
  .eff .tgt{font-size:11px;color:var(--faint);margin-top:2px}
  .plot{position:relative;margin-top:8px}
  .plot svg{width:100%;height:auto}
  .plot .ax{position:absolute;right:0;top:0;bottom:16px;display:flex;flex-direction:column;justify-content:space-between;
    font-size:9.5px;color:var(--faint);text-align:right}
  .plot .xs{display:flex;justify-content:space-between;font-size:9.5px;color:var(--faint);padding:2px 46px 0 2px}

  .fleet{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .veh{padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px;text-align:left;
    transition:background .2s cubic-bezier(.32,.72,0,1),border-color .2s}
  .veh:hover{border-color:var(--hair2)}
  .veh[aria-pressed="true"]{background:var(--sel);border-color:var(--hair2)}
  .veh .hd{display:flex;justify-content:space-between;align-items:flex-start}
  .veh .hd b{font-weight:500;font-size:12.5px;display:block}
  .veh .hd small{font-size:10px;color:var(--faint);display:block;margin-top:1px}
  .veh .hd .go{color:var(--faint);margin-top:2px}
  .veh .pic{position:relative;height:52px;display:flex;align-items:center;justify-content:space-between;gap:6px}
  .veh .pic>svg{height:66px;width:auto;flex:none;max-width:74%;margin-top:-8px}
  .veh .id svg{width:8px;height:8px}
  .veh .id{flex:none;font-size:9.5px;color:var(--dim);padding:2px 6px;border-radius:5px;
    background:rgba(240,242,245,.06);border:1px solid var(--hair);display:flex;align-items:center;gap:4px}
  .veh .meta{display:flex;align-items:center;gap:10px;font-size:10.5px;color:var(--dim)}
  .veh .meta .on{color:var(--dim)}
  .veh .meta span{display:flex;align-items:center;gap:3px;margin-left:auto}
  .veh .meta span+span{margin-left:0}
  .veh .mini{height:64px;border-radius:8px;background:rgba(240,242,245,.03);border:1px solid var(--hair);overflow:hidden;position:relative}
  .veh .mini svg{width:100%;height:100%}
  .veh .tl{display:flex;justify-content:space-between;align-items:center;font-size:9.5px;color:var(--faint)}
  .veh .tl .bar2{flex:1;height:2px;margin:0 8px;background:rgba(240,242,245,.1);border-radius:2px;position:relative}
  .veh .tl .bar2::after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--p,40%);background:#C9CDD3;border-radius:2px}
  .veh .tl .bar2::before{content:"";position:absolute;right:0;top:0;bottom:0;width:22%;background:repeating-linear-gradient(90deg,rgba(240,242,245,.35) 0 3px,transparent 3px 6px)}
  .veh .tl .bar2::before{content:"";position:absolute;right:0;top:0;bottom:0;width:22%;background:repeating-linear-gradient(90deg,rgba(240,242,245,.35) 0 3px,transparent 3px 6px)}
  .veh .tl .bar2::before{content:"";position:absolute;right:0;top:0;bottom:0;width:22%;background:repeating-linear-gradient(90deg,rgba(240,242,245,.35) 0 3px,transparent 3px 6px)}
  .veh .tl .bar2::before{content:"";position:absolute;right:0;top:0;bottom:0;width:22%;background:repeating-linear-gradient(90deg,rgba(240,242,245,.35) 0 3px,transparent 3px 6px)}
  .veh .tl .bar2::before{content:"";position:absolute;right:0;top:0;bottom:0;width:22%;background:repeating-linear-gradient(90deg,rgba(240,242,245,.35) 0 3px,transparent 3px 6px)}

  .veh .tl .bar2::before{content:"";position:absolute;right:0;top:0;bottom:0;width:22%;background:repeating-linear-gradient(90deg,rgba(240,242,245,.35) 0 3px,transparent 3px 6px)}

  .veh .tl .bar2::before{content:"";position:absolute;right:0;top:0;bottom:0;width:22%;background:repeating-linear-gradient(90deg,rgba(240,242,245,.35) 0 3px,transparent 3px 6px)}

  .veh.compact .pic{height:48px}
  .veh.compact .pic>svg{height:56px}

  /* ───────── stage: everything over the map, right of the rail ───────── */
  .stage{position:fixed;left:var(--rail);right:0;top:var(--barh);bottom:0;z-index:4;pointer-events:none;padding:var(--gap)}
  .stage>*{pointer-events:auto}
  .title{position:absolute;left:var(--gap);top:-2px;line-height:1;font-size:clamp(22px,2.3vw,32px);font-weight:300;letter-spacing:-.02em;
    text-shadow:0 2px 24px rgba(0,0,0,.7);pointer-events:none}
  .mapctl{position:absolute;left:var(--gap);bottom:calc(var(--footh) + var(--gap) + 12px);display:flex;gap:6px}
  .mapctl button{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--dim);
    background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--hair)}
  .mapctl button:hover{color:var(--ink);border-color:var(--hair2)}

  /* warning panel: grey glass, red announcements (reference layout) */
  .warn{position:absolute;right:var(--gap);top:var(--gap);width:clamp(264px,21vw,304px);max-height:calc(100% - var(--footh) - var(--gap)*3);overflow-y:auto;scrollbar-width:none;
    background:rgba(28,28,31,.72);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border:1px solid rgba(240,242,245,.09);border-radius:14px;padding:14px 14px 10px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .warn::-webkit-scrollbar{display:none}
  .warn h3{margin:0;font-size:12px;font-weight:400;color:#E6E8EB}
  .wsec{margin-top:14px}
  .wsec .h{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink)}
  .wsec .h svg{color:var(--dim)}
  .wsec .h span{color:var(--dim);margin-left:2px;font-size:11px}
  .wsec .h .chev{margin-left:auto;color:var(--faint)}

<script>
/* ── shared unit simulation: positions for cards, 2D pins and the 3D scene ── */
(() => {
  const ROUTES = { A: [[1332,275],[1340,520],[1350,760],[1350,1000],[1352,1452],[300,1452]],
                   B: [[188,792],[660,792],[660,988],[1180,988],[1240,1040],[1240,1330],[1350,1330]] };
  const units = JSON.parse(document.getElementById('units').textContent);
  const seg = {}; for (const k in ROUTES) { const r = ROUTES[k], L = [0]; for (let i = 1; i < r.length; i++) L.push(L[i-1] + Math.hypot(r[i][0]-r[i-1][0], r[i][1]-r[i-1][1])); seg[k] = L; }
  const at = (k, t) => { const r = ROUTES[k], L = seg[k], d = t * L[L.length-1]; let i = 1; while (i < L.length-1 && L[i] < d) i++;
    const f = (d - L[i-1]) / (L[i] - L[i-1] || 1), a = r[i-1], b = r[i];
    return { x: a[0] + (b[0]-a[0]) * f, y: a[1] + (b[1]-a[1]) * f, heading: Math.atan2(b[1]-a[1], b[0]-a[0]) }; };
  const now0 = Date.now();
  for (const u of units) { u.startedAt = now0 - u.since * 1000; Object.assign(u, at(u.route, u.t)); }
  window.UNITS = units;

  // department chips: counts from the unit list, click to filter the cards
  const counts = { all: units.length, pd: 0, fd: 0, dot: 0 }; for (const u of units) counts[u.dept]++;
  for (const el of document.querySelectorAll('[data-count]')) el.textContent = counts[el.dataset.count] ?? 0;
  const chips = [...document.querySelectorAll('.chips button[data-filter]')];
  chips.forEach(c => c.addEventListener('click', () => {
    chips.forEach(x => x.setAttribute('aria-pressed', x === c));
    const f = c.dataset.filter;
    for (const card of document.querySelectorAll('.veh[data-unit]')) card.hidden = f !== 'all' && !card.classList.contains('dept-' + f);
  }));

  const MAP = document.getElementById('mapsrc')?.getAttribute('href') || document.querySelector('.view img')?.getAttribute('src');
  const minis = [...document.querySelectorAll('.mini.live')].map(el => ({ el, u: units.find(x => x.id === el.dataset.unit) }));
  const timers = [...document.querySelectorAll('.timer[data-unit]')].map(el => ({ el, u: units.find(x => x.id === el.dataset.unit) }));
  const spds = [...document.querySelectorAll('.spd[data-unit]')].map(el => ({ el, u: units.find(x => x.id === el.dataset.unit) }));
  const bars = [...document.querySelectorAll('.veh[data-unit]')].map(el => ({ el: el.querySelector('.bar2'), u: units.find(x => x.id === el.dataset.unit) }));
  const VIEW = 300;                                   // world units visible across a mini map
  const setMini = url => { for (const m of minis) m.el.style.backgroundImage = `url("${url}")`; };
  if (MAP) setMini(MAP);
  addEventListener('maptheme', e => { const l = document.getElementById('mapsrc')?.getAttribute('href'), d = document.getElementById('mapsrc-dark')?.getAttribute('href') || document.querySelector('.view img')?.dataset.dark; setMini(e.detail.theme === 'dark' ? (d || l) : (l || d)); });
  let w = 0, h = 0; const measure = () => { const r = minis[0]?.el.getBoundingClientRect(); if (r) { w = r.width; h = r.height; } };
  measure(); addEventListener('resize', measure);

  let last = performance.now(), tick = 0;
  const loop = (ts) => {
    const dt = Math.min((ts - last) / 1000, 0.05); last = ts;
    for (const u of units) { u.t += u.dir * u.speed * dt; if (u.t > 1) { u.t = 1; u.dir = -1; } if (u.t < 0) { u.t = 0; u.dir = 1; }
      const p = at(u.route, u.t); u.x = p.x; u.y = p.y; if (u.dir < 0) p.heading += Math.PI; u.heading = p.heading; }
    if (w) { const sc = w / VIEW; const size = 2000 * sc;
      for (const { el, u } of minis) { el.style.backgroundSize = `${size}px ${size}px`; el.style.backgroundPosition = `${w/2 - u.x*sc}px ${h/2 - u.y*sc}px`;
        el.querySelector('.pin').style.transform = `rotate(${u.heading + Math.PI/2}rad)`; } }
    if (++tick % 20 === 0) { const now = Date.now();
      for (const { el, u } of spds) el.textContent = Math.round(u.speed * seg[u.route][seg[u.route].length-1] * 2.237 * (0.92 + 0.16 * Math.abs(Math.sin(ts / 4000 + u.t * 9))));
      for (const { el, u } of timers) { const s = Math.floor((now - u.startedAt) / 1000);
        el.textContent = `${Math.floor(s/3600)}:${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
      for (const { el, u } of bars) if (el) el.style.setProperty('--p', Math.min(100, (now - u.startedAt) / 36e5 / 8 * 100).toFixed(1) + '%'); }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();
</script>
<script>
/* ── Unit Availability: real chart over shift data ── */
(() => {
  const svg = document.getElementById('avSvg'), num = document.getElementById('avNum'), sub = document.getElementById('avSub'),
        xs = document.getElementById('avXs'), hov = document.getElementById('avHov'), plot = document.getElementById('avPlot');
  if (!svg) return;
  const TARGET = 80, START = 9, END = 21, STEP = 0.5;           // shift window, half-hour samples
  const PLOT_W = 252, TOP = 8, BOT = 84;                          // drawing area inside the 300x86 viewBox
  let seed = 23; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  // one sample per half hour: units on duty and how many of them are free (not on a call)
  const data = [];
  for (let h = START; h <= END; h += STEP) {
    const onduty = Math.round(17 + 9 * Math.sin((h - 8) / 14 * Math.PI) + rnd() * 3);
    const busy = Math.round(2 + rnd() * 5 + (h >= 17 && h <= 19 ? 3 : 0));
    data.push({ h, onduty, avail: Math.max(0, onduty - busy) });
  }
  const pct = d => d.onduty ? d.avail / d.onduty * 100 : 0;
  const X = i => i / (data.length - 1) * PLOT_W;
  const Y = v => BOT - (v / 100) * (BOT - TOP);
  const fmt = h => String(Math.floor(h)).padStart(2, '0') + ':' + (h % 1 ? '30' : '00');

  const render = () => {
    const maxOn = Math.max(...data.map(d => d.onduty)) || 1;
    const bw = PLOT_W / data.length * 0.55;
    let g = '<g stroke="rgba(240,242,245,.07)" stroke-width="1">';
    for (const v of [100, 75, 50, 25]) g += `<line x1="0" y1="${Y(v)}" x2="${PLOT_W}" y2="${Y(v)}"/>`;
    g += '</g><g fill="rgba(240,242,245,.09)">';
    data.forEach((d, i) => { const h = (d.onduty / maxOn) * (BOT - TOP) * 0.8; g += `<rect x="${X(i) - bw / 2}" y="${BOT - h}" width="${bw}" height="${h}"/>`; });
    g += '</g>';
    // highlight the two best half-hours
    const top2 = [...data.keys()].sort((a, b) => pct(data[b]) - pct(data[a])).slice(0, 2);
    for (const i of top2) g += `<rect x="${X(i) - bw}" y="${TOP}" width="${bw * 2}" height="${BOT - TOP}" fill="rgba(240,242,245,.10)"/>`;
    // target
    g += `<line x1="0" y1="${Y(TARGET)}" x2="${PLOT_W}" y2="${Y(TARGET)}" stroke="#E9A24C" stroke-width="1" stroke-dasharray="3 3" opacity=".8"/>`;
    g += `<text x="${PLOT_W - 2}" y="${Y(TARGET) - 3}" font-size="7.5" fill="#E9A24C" text-anchor="end" font-family="inherit">${TARGET}%</text>`;
    // availability line
    const pts = data.map((d, i) => `${X(i)} ${Y(pct(d))}`);
    g += `<path d="M${pts.join(' L')}" fill="none" stroke="#F0F2F5" stroke-width="1.3" stroke-linejoin="round"/>`;
    for (const i of top2) g += `<circle cx="${X(i)}" cy="${Y(pct(data[i]))}" r="2.4" fill="#F0F2F5"/>`;
    g += '<line id="avCur" x1="-10" y1="' + TOP + '" x2="-10" y2="' + BOT + '" stroke="rgba(240,242,245,.35)" stroke-width="1"/>';
    svg.innerHTML = g;
    const last = data[data.length - 1], p = pct(last);
    num.innerHTML = Math.floor(p) + '.<span class="d">' + Math.round((p % 1) * 10) + '</span>';
    sub.textContent = `${last.avail} of ${last.onduty} units free`;
    num.style.color = p < TARGET - 15 ? 'var(--red)' : '';
    xs.innerHTML = [9, 12, 15, 18, 21].map(h => `<span>${fmt(h)}</span>`).join('');
  };

  // hover / keyboard readout
  const show = i => { const d = data[i], r = plot.getBoundingClientRect();
    const px = X(i) / 300 * r.width;
    hov.innerHTML = `<b>${fmt(d.h)}</b> · <b>${Math.round(pct(d))}%</b> · ${d.avail}/${d.onduty} free`; hov.style.left = Math.min(Math.max(px, 44), r.width - 60) + 'px'; hov.hidden = false;
    const cur = svg.querySelector('#avCur'); cur.setAttribute('x1', X(i)); cur.setAttribute('x2', X(i)); };
  const hide = () => { hov.hidden = true; const cur = svg.querySelector('#avCur'); cur.setAttribute('x1', -10); cur.setAttribute('x2', -10); };
  plot.addEventListener('pointermove', e => { const r = plot.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width * 300;
    if (x > PLOT_W) return hide(); show(Math.round(x / PLOT_W * (data.length - 1))); });
  plot.addEventListener('pointerleave', hide);
  let ki = data.length - 1;
  plot.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') ki = Math.max(0, ki - 1); else if (e.key === 'ArrowRight') ki = Math.min(data.length - 1, ki + 1); else return; e.preventDefault(); show(ki); });

  // live feed: the current half-hour keeps moving as units take and clear calls
  setInterval(() => { const d = data[data.length - 1]; d.avail = Math.max(0, Math.min(d.onduty, d.avail + (rnd() < 0.5 ? -1 : 1))); render(); }, 4000);
  render();
})();
</script>

    for (const el of duty.querySelectorAll('.time [data-start]')) el.textContent = fmtDur((t - el.dataset.start) / 1000);
    for (const el of calls.querySelectorAll('.age')) el.textContent = fmtAge((t - el.dataset.start) / 1000); }
})();
</script>
<script>
/* ── incoming calls feed: the warning panel, new-call simulation, dispatch recommendation ── */
(() => {
  const UN = window.UNITS || [], CALLS = window.CALLS || [], COL = { pd: '#4C8DFF', fd: '#E24B4B', dot: '#E9C24C' };
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const list = document.getElementById('warnList'), ulist = document.getElementById('warnUnits');
  const fmtAge = s => s < 60 ? 'just now' : s < 3600 ? `${Math.floor(s / 60)}m ago` : `${Math.floor(s / 3600)}h ${Math.floor(s / 60) % 60}m ago`;
  const NEW_WINDOW = 10 * 60 * 1000;
  const deptFor = code => ({ '10-70': 'fd', '10-50': 'fd', '10-52': 'fd', '10-53': 'dot', '10-46': 'dot' }[code] || 'pd');
  const nearest = c => UN.map(u => ({ u, d: Math.hypot(u.x - c.x, u.y - c.y) })).sort((a, b) => a.d - b.d);
  let flash = null;

  let open = null;                                   // startedAt of the expanded alert
  const alertRow = (c, text, sub, extra) => `<div class="alert${c === flash ? ' new' : ''}${open === c.startedAt ? ' open' : ''}" role="button" tabindex="0" aria-expanded="${open === c.startedAt}" data-open="${c.startedAt}"><div class="ic">!</div><div class="t">${text}<small>${sub}</small></div><span class="chev"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg></span></div>` + (open === c.startedAt ? `<div class="det">${extra}</div>` : '');
  const render = () => {
    const now = Date.now();
    const fresh = CALLS.filter(c => now - c.startedAt < NEW_WINDOW).sort((a, b) => b.startedAt - a.startedAt);
    document.getElementById('warnNew').textContent = `(${fresh.length} ${fresh.length === 1 ? 'call' : 'calls'})`;
    if (!fresh.length) { list.innerHTML = '<div class="empty">No new calls in the last 10 minutes.</div>'; }
    else list.innerHTML = fresh.slice(0, 3).map(c => {
      let extra = '';
      if (!c.unit) {
        const dept = deptFor(c.code), near = nearest(c).filter(n => n.u.dept === dept).slice(0, 2);
        extra += `<div class="aff">Nearest units:` + near.map(n => `<div class="r">${esc(n.u.name)}<small>(${(n.d / 1609 * 1.2).toFixed(1)} mi away, 10-8)</small></div>`).join('') + `</div>`;
        if (near[0]) extra += `<button type="button" class="rec" data-dispatch="${esc(c.code)}|${c.startedAt}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><div>Recommend<small>Dispatching ${esc(near[0].u.name)}</small></div></button>`;
      } else {
        const u = UN.find(x => x.name === c.unit), d = u ? Math.hypot(u.x - c.x, u.y - c.y) : 0;
        extra += `<div class="aff">Assigned unit:<div class="r">${esc(c.unit)}<small>(${STAGE_TXT[c.stage] || ''}${u ? ', ' + (d / 1609 * 1.2).toFixed(1) + ' mi away' : ''})</small></div></div>`;
        extra += `<div class="rec"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><div>Priority ${c.pri}<small>${esc(c.type)}</small></div></div>`;
      }
      return alertRow(c, `${c.code} ${esc(c.type)}`, `<span>${esc(c.where)}</span> · <span data-start="${c.startedAt}">${fmtAge((now - c.startedAt) / 1000)}</span>`, extra); }).join('');
    const ua = CALLS.filter(c => c.unit && (c.code === '10-80' || (c.pri === 1 && c.stage < 2)));
    document.getElementById('warnUnitN').textContent = `(${ua.length} ${ua.length === 1 ? 'unit' : 'units'})`;
    ulist.innerHTML = ua.length ? ua.slice(0, 3).map(c => alertRow(c, `${esc(c.unit)} is ${c.code === '10-80' ? 'in pursuit' : 'en route to ' + c.code}`, `<span>${esc(c.where)}</span> · <span data-start="${c.startedAt}">${fmtAge((now - c.startedAt) / 1000)}</span>`,
        `<div class="aff">Call:<div class="r">${c.code} ${esc(c.type)}<small>(priority ${c.pri}, ${STAGE_TXT[c.stage] || ''})</small></div></div>`)).join('')
      : '<div class="empty">No unit alerts.</div>';
  };
  const STAGE_TXT = ['dispatched', 'en route', 'on scene'];
  document.getElementById('warn').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.alert')) { e.preventDefault(); e.target.click(); } });
  document.getElementById('warn').addEventListener('click', e => {
    const al = e.target.closest('.alert[data-open]');
    if (al) { open = open === +al.dataset.open ? null : +al.dataset.open; render(); return; }
    const b = e.target.closest('[data-dispatch]'); if (!b) return;
    const [code, t] = b.dataset.dispatch.split('|'); const c = CALLS.find(x => x.code === code && String(x.startedAt) === t); if (!c) return;
    const dept = deptFor(c.code), n = nearest(c).find(n => n.u.dept === dept); if (n) window.assignCall(c, n.u.name, n.u.dept);
  });
  addEventListener('calls', render);
  setInterval(() => { const now = Date.now(); for (const el of document.querySelectorAll('#warn [data-start]')) el.textContent = fmtAge((now - el.dataset.start) / 1000); }, 1000);

  // simulated feed: a new call every so often; replace with the server feed
  const POOL = [
    { pri: 1, code: '10-52', type: 'Medical emergency, unresponsive', where: 'Liberty Mall, food court', x: 1000, y: 1613 },
    { pri: 2, code: '10-32', type: 'Person with a weapon', where: 'Gas station, Route 1', x: 1350, y: 1000 },
    { pri: 2, code: '10-50', type: 'Vehicle collision, no injuries', where: 'Highway 1 & Bridge Rd', x: 1340, y: 520 },
    { pri: 3, code: '10-46', type: 'Disabled vehicle', where: 'Interstate shoulder, mile 3', x: 1350, y: 760 },
    { pri: 1, code: '10-70', type: 'Vehicle fire', where: 'Parking garage, Downtown', x: 880, y: 1452 },
    { pri: 3, code: '10-66', type: 'Suspicious person', where: 'Riverside Park', x: 660, y: 988 },
  ];
  let pi = 0;
  const incoming = () => { const c = { ...POOL[pi++ % POOL.length], unit: '', dept: '', stage: 0, startedAt: Date.now() };
    flash = c; window.addCall(c); setTimeout(() => { if (flash === c) { flash = null; render(); } }, 1600); };
  setTimeout(incoming, 6000); setInterval(incoming, 32000);
  render();
})();
</script>

  const UPDATES = [

  ];

    <div class="up" title="Last 90 days">${[...c.hist].map(h => `<i class="${h === 'd' ? 'd' : h === 'x' ? 'x' : h === 'm' ? 'm' : ''}"></i>`).join('')}</div>
    <div class="meta"><span>90 days ago</span><span>${c.uptime.toFixed(2)}% uptime${c.ms != null ? ' · ' + c.ms + ' ms' : ''}</span><span>Today</span></div></div>`).join('');

<script>
(() => {
  // ── map camera ──
  const view = document.getElementById('view');
  const world = document.getElementById('world');
  const stage = document.getElementById('stage');
  const W = 2000, FOCUS = { x: 1060, y: 1060 };
  let s = 1, tx = 0, ty = 0;

  // unit pins come from the shared simulation (window.UNITS)
  const UN = window.UNITS || [], COL = { pd: '#4C8DFF', fd: '#E24B4B', dot: '#E9C24C' };
  const pinsEl = document.getElementById('pins');
  pinsEl.insertAdjacentHTML('beforeend', UN.map((u, i) => i === 0
    ? `<div class="pin" data-unit="${u.id}"><div class="focus"><div class="nav"><svg width="13" height="13" viewBox="0 0 24 24" fill="#0B0B0C"><path d="M12 2 4 21l8-4 8 4z"/></svg></div></div></div>`
    : `<div class="pin" data-unit="${u.id}"><div class="veh-dot" style="background:${COL[u.dept]};box-shadow:0 0 0 3px ${COL[u.dept]}40,0 0 0 1px #0B0B0C inset"></div></div>`).join('')
    + (UN[0] ? `<div class="pin" data-unit="${UN[0].id}" style="transform:none"><div class="tip" style="transform:translate(-128%,-10%)"><div class="k">${UN[0].name}</div><div class="s">${UN[0].crew.join(', ')}</div><div class="v">10-8<small>available</small></div></div></div>` : ''));
  const byId = Object.fromEntries(UN.map(u => [u.id, u]));
  let pins = [];
  const syncCallPins = () => { for (const el of pinsEl.querySelectorAll('.pin.call')) el.remove();
    for (const c of (window.CALLS || [])) pinsEl.insertAdjacentHTML('beforeend', `<div class="pin call" data-x="${c.x}" data-y="${c.y}"><div class="veh-dot ${c.pri === 1 ? 'red' : 'amber'}"></div></div>`);
    pins = [...document.querySelectorAll('#pins .pin')]; };
  syncCallPins(); addEventListener('calls', syncCallPins);
  const apply = () => {
    world.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
    for (const p of pins) {
      const u = byId[p.dataset.unit];
      if (u) { p.dataset.x = u.x; p.dataset.y = u.y; const nav = p.querySelector('.nav'); if (nav) nav.style.transform = `rotate(${u.heading + Math.PI / 2}rad)`; }
      p.style.left = (tx + p.dataset.x * s) + 'px';
      p.style.top  = (ty + p.dataset.y * s) + 'px';
    }
  };
  const track = () => { apply(); requestAnimationFrame(track); }; requestAnimationFrame(track);
  const fit = () => {
    const r = stage.getBoundingClientRect();
    s = Math.max(window.innerWidth, window.innerHeight) / W * 1.05;
    tx = r.left + r.width * .5 - FOCUS.x * s;
    ty = r.top + r.height * .42 - FOCUS.y * s;
    apply();
  };
  const zoomAt = (f, cx, cy) => {
    const ns = Math.min(4, Math.max(.45, s * f));
    tx = cx - (cx - tx) * (ns / s);
    ty = cy - (cy - ty) * (ns / s);
    s = ns; apply();
  };

  let drag = null;
  const is3d = () => document.body.classList.contains('mode-3d');   // the 3D controls own the pointer in 3D mode
  view.addEventListener('pointerdown', e => {
    if (is3d()) return;
    drag = { x: e.clientX, y: e.clientY, tx, ty };
    view.setPointerCapture(e.pointerId); view.classList.add('drag');
  });
  view.addEventListener('pointermove', e => {
    if (!drag) return;
    tx = drag.tx + (e.clientX - drag.x); ty = drag.ty + (e.clientY - drag.y); apply();
  });
  const end = () => { drag = null; view.classList.remove('drag'); };
  view.addEventListener('pointerup', end); view.addEventListener('pointercancel', end);
  view.addEventListener('wheel', e => {
    if (is3d()) return;
    e.preventDefault();
    zoomAt(Math.exp(-e.deltaY * .0016), e.clientX, e.clientY);
  }, { passive: false });

  const center = () => { const r = stage.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  const img = world.querySelector('img');
  if (!img.getAttribute('src') && img.dataset.dark) img.setAttribute('src', img.dataset.dark);
  window.map2d = { zoomIn: () => zoomAt(1.25, ...center()), zoomOut: () => zoomAt(.8, ...center()), fit,
    setTheme: t => { const src = img.dataset[t === 'dark' ? 'dark' : 'light']; if (src && img.getAttribute('src') !== src) img.setAttribute('src', src); } };
  document.getElementById('zin').onclick  = window.map2d.zoomIn;
  document.getElementById('zout').onclick = window.map2d.zoomOut;
  const zfitBtn = document.getElementById('zfit'); if (zfitBtn) zfitBtn.onclick = fit;
  window.addEventListener('resize', fit);
  fit();

  // ── tabs / toggles (visual only) ──
  document.querySelectorAll('.veh').forEach(b => b.onclick = () => {
    document.querySelectorAll('.veh').forEach(x => x.setAttribute('aria-pressed', x === b));
  });
})();
</script>
