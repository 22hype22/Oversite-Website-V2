<title>Liberty County Map</title>
<style>
  :root{
    --ground:#0E1012;
    --ink:#E9ECEF;
    --dim:#8B9097;
    --hair:rgba(233,236,239,.12);
    --f:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--ground);color:var(--ink);font-family:var(--f);
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  :focus-visible{outline:1px solid #E9A24C;outline-offset:2px}

  .stage{
    position:absolute;inset:0;overflow:hidden;cursor:grab;
    background:var(--ground);touch-action:none;
  }
  .stage.drag{cursor:grabbing}
  .stage img{
    position:absolute;top:50%;left:50%;width:auto;height:auto;
    max-width:none;transform-origin:0 0;user-select:none;-webkit-user-drag:none;
    image-rendering:auto;
  }

  .hud{
    position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;
    padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;
    background:linear-gradient(180deg,rgba(14,16,18,.9),rgba(14,16,18,0));
    pointer-events:none;
  }
  .hud h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
  .hud p{margin:0;font-size:11.5px;color:var(--dim)}

  .tools{
    position:absolute;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));
    display:flex;flex-direction:column;gap:7px;
  }
  .tools button{
    width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(20,22,25,.86);border:1px solid var(--hair);color:var(--dim);
    backdrop-filter:blur(12px);transition:color .16s,background .16s;
  }
  .tools button:hover{color:var(--ink);background:rgba(32,35,39,.92)}

  .zoomtag{
    position:absolute;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));
    padding:6px 11px;border-radius:999px;background:rgba(20,22,25,.86);
    border:1px solid var(--hair);font-size:11px;color:var(--dim);
    font-variant-numeric:tabular-nums;backdrop-filter:blur(12px);
  }

  .swap{
    position:absolute;right:18px;top:calc(16px + env(safe-area-inset-top,0px));
    display:flex;gap:2px;padding:3px;border-radius:999px;
    background:rgba(20,22,25,.86);border:1px solid var(--hair);backdrop-filter:blur(12px);
  }
  .swap button{
    padding:5px 13px;border-radius:999px;font-size:11px;color:var(--dim);
    transition:background .16s,color .16s;
  }
  .swap button:hover{color:var(--ink)}
  .swap button[aria-pressed="true"]{background:#E9ECEF;color:#0E1012;font-weight:500}

  .hint{
    position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(18px + env(safe-area-inset-bottom,0px));
    padding:6px 13px;border-radius:999px;background:rgba(20,22,25,.8);
    border:1px solid var(--hair);font-size:11px;color:var(--dim);
    backdrop-filter:blur(12px);white-space:nowrap;
  }
  @media (max-width:620px){.hint{display:none}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="stage" id="stage">
  <img id="map" src="liberty-county-dark.jpg" alt="Aerial map of Liberty County, Emergency Response: Liberty County" draggable="false">
</div>

<div class="hud">
  <div>
    <h1>Liberty County</h1>
    <p>Emergency Response: Liberty County &mdash; current map</p>
  </div>
</div>

<div class="swap" role="group" aria-label="Map treatment">
  <button type="button" id="bGraded" aria-pressed="true">Graded</button>
  <button type="button" id="bRaw" aria-pressed="false">Original</button>
</div>

<div class="zoomtag" id="tag">100%</div>
<div class="hint">Drag to pan &middot; scroll to zoom &middot; double-click to reset</div>

<div class="tools">
  <button type="button" id="zin" aria-label="Zoom in">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
      <path d="M7 2.4v9.2M2.4 7h9.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    </svg>
  </button>
  <button type="button" id="zfit" aria-label="Fit map to screen">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
      <path d="M2.2 5.2V2.2h3M11.8 5.2V2.2h-3M2.2 8.8v3h3M11.8 8.8v3h-3"
            stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <button type="button" id="zout" aria-label="Zoom out">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
      <path d="M2.4 7h9.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    </svg>
  </button>
</div>

<script>
(function () {
  "use strict";

  var stage = document.getElementById("stage");
  var map   = document.getElementById("map");
  var tag   = document.getElementById("tag");

  var NAT = 2560;                 /* the image is square at this size */
  var fit = 1, scale = 1, tx = 0, ty = 0;

  function apply() {
    map.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + scale + ")";
    tag.textContent = Math.round(scale / fit * 100) + "%";
  }

  function reset() {
    var w = stage.clientWidth, h = stage.clientHeight;
    fit = Math.min(w / NAT, h / NAT) * 0.94;
    scale = fit;
    tx = -NAT * scale / 2;
    ty = -NAT * scale / 2;
    apply();
  }

  function zoomAt(cx, cy, factor) {
    var next = Math.min(fit * 8, Math.max(fit * 0.5, scale * factor));
    if (next === scale) return;
    /* keep the point under the cursor fixed */
    var ox = stage.clientWidth / 2 + tx;
    var oy = stage.clientHeight / 2 + ty;
    var k = next / scale;
    tx = (ox - cx) * k + cx - stage.clientWidth / 2;
    ty = (oy - cy) * k + cy - stage.clientHeight / 2;
    scale = next;
    apply();
  }

  /* drag to pan */
  var down = false, px = 0, py = 0;
  stage.addEventListener("pointerdown", function (e) {
    down = true; px = e.clientX; py = e.clientY;
    stage.classList.add("drag");
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointermove", function (e) {
    if (!down) return;
    tx += e.clientX - px; ty += e.clientY - py;
    px = e.clientX; py = e.clientY;
    apply();
  });
  function up(e) {
    down = false; stage.classList.remove("drag");
    if (e && e.pointerId !== undefined && stage.hasPointerCapture(e.pointerId)) {
      stage.releasePointerCapture(e.pointerId);
    }
  }
  stage.addEventListener("pointerup", up);
  stage.addEventListener("pointercancel", up);

  /* wheel to zoom */
  stage.addEventListener("wheel", function (e) {
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.14 : 1 / 1.14);
  }, { passive: false });

  stage.addEventListener("dblclick", reset);

  document.getElementById("zin").addEventListener("click", function () {
    zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1.35);
  });
  document.getElementById("zout").addEventListener("click", function () {
    zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1 / 1.35);
  });
  document.getElementById("zfit").addEventListener("click", reset);

  /* graded / original — swap the source, hold the view */
  var bG = document.getElementById("bGraded"), bR = document.getElementById("bRaw");
  function pick(src, on, off) {
    map.src = src;
    on.setAttribute("aria-pressed", "true");
    off.setAttribute("aria-pressed", "false");
  }
  bG.addEventListener("click", function () { pick("liberty-county-dark.jpg", bG, bR); });
  bR.addEventListener("click", function () { pick("liberty-county.jpg", bR, bG); });

  window.addEventListener("resize", reset);
  /* both sources are the same square size, so a swap keeps the current view */
  if (!map.complete) map.addEventListener("load", reset, { once: true });
  reset();
})();
</script>
