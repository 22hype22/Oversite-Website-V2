<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Explore card styles</title>
<style>
:root{color-scheme:dark;--ink:#F0F2F5;--dim:#9A9EA6;--faint:#62666D;--hair:rgba(240,242,245,.08);--hair2:rgba(240,242,245,.14);--panel:rgba(16,16,18,.78);--ok:#46D07C;--warn:#E9B04C;--dc:#5865F2}
*{box-sizing:border-box}html,body{margin:0}
body{font:14px/1.5 Geist,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#0d1416;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:-1;background:#386069 url(liberty-county.jpg) center/cover;filter:brightness(.42) saturate(.85)}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(11,11,12,.25),rgba(11,11,12,.85))}
section{max-width:1180px;margin:0 auto;padding:34px 24px 40px}
h2.v{display:flex;align-items:baseline;gap:12px;margin:0 0 4px;font-size:22px;font-weight:600}h2.v span{font-size:13px;font-weight:500;color:var(--dim);padding:3px 10px;border:1px solid var(--hair2);border-radius:999px}
p.vd{margin:0 0 18px;color:var(--dim);max-width:760px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font:inherit;font-weight:500;font-size:12.5px;padding:7px 13px;border-radius:999px;border:1px solid var(--hair2);background:rgba(255,255,255,.06);color:var(--ink);text-decoration:none;white-space:nowrap;cursor:pointer}
.btn.pri{background:#F0F2F5;color:#0B0B0C;border-color:#F0F2F5}.btn.dc{background:var(--dc);border-color:var(--dc);color:#fff}
.btn code{font-family:ui-monospace,Menlo,monospace}
.ic{position:relative;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;overflow:hidden}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(70,208,124,.6);animation:ping 2s infinite}
.full .live i{background:var(--warn);animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(70,208,124,.55)}70%{box-shadow:0 0 0 7px rgba(70,208,124,0)}100%{box-shadow:0 0 0 0 rgba(70,208,124,0)}}
.dcI{width:14px;height:14px}

/* ── 1. Banner ── */
.s1{border-radius:18px;overflow:hidden;background:var(--panel);border:1px solid var(--hair);backdrop-filter:blur(18px);transition:transform .25s cubic-bezier(.23,1,.32,1),border-color .2s,box-shadow .25s;cursor:pointer}
.s1 .bn{height:108px;background:url(liberty-county.jpg) var(--pos)/900% no-repeat;position:relative;transition:background-size .5s cubic-bezier(.23,1,.32,1)}
.s1 .bn::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,12,14,0) 30%,rgba(16,16,18,.95))}
.s1 .bn .live{position:absolute;right:12px;top:12px;z-index:1;padding:5px 10px;border-radius:999px;background:rgba(8,9,11,.72);backdrop-filter:blur(6px)}
.s1 .bd{padding:0 18px 18px;margin-top:-30px;position:relative}
.s1 .ic{width:60px;height:60px;border-radius:16px;font-size:24px;border:3px solid #131416;box-shadow:0 8px 20px rgba(0,0,0,.45)}
.s1 h3{margin:12px 0 2px;font-size:17px}.s1 .ow{color:var(--dim);font-size:12.5px}
.s1 p{color:#C9CDD3;font-size:13.5px;margin:10px 0 14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.s1 .ac{display:flex;gap:8px;flex-wrap:wrap}
.s1:hover,.s1.h{transform:translateY(-4px);border-color:rgba(240,242,245,.2);box-shadow:0 22px 40px -18px rgba(0,0,0,.8)}
.s1:hover .bn,.s1.h .bn{background-size:1000%}

/* ── 2. Map tile ── */
.s2{position:relative;height:300px;border-radius:20px;overflow:hidden;cursor:pointer;background:url(liberty-county.jpg) var(--pos)/700% no-repeat;border:1px solid var(--hair2);transition:transform .3s cubic-bezier(.23,1,.32,1),box-shadow .3s}
.s2::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,8,10,.15) 0%,rgba(6,8,10,.35) 40%,rgba(6,8,10,.94) 100%)}
.s2 .tp{position:absolute;left:16px;right:16px;top:16px;display:flex;justify-content:space-between;align-items:center}
.s2 .ic{width:44px;height:44px;border-radius:12px;font-size:18px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.s2 .live{padding:5px 10px;border-radius:999px;background:rgba(8,9,11,.66);backdrop-filter:blur(6px)}
.s2 .bt{position:absolute;left:18px;right:18px;bottom:16px}
.s2 h3{margin:0 0 4px;font-size:21px;letter-spacing:-.01em}.s2 p{margin:0;color:#D5D8DD;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.s2 .ac{display:flex;gap:8px;margin-top:14px;max-height:0;opacity:0;overflow:hidden;transition:max-height .35s cubic-bezier(.23,1,.32,1),opacity .25s}
.s2:hover,.s2.h{transform:translateY(-4px) scale(1.01);box-shadow:0 26px 50px -20px rgba(0,0,0,.85)}
.s2:hover .ac,.s2.h .ac{max-height:44px;opacity:1}

/* ── 3. Player ring ── */
.s3{position:relative;padding:20px;border-radius:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--a) 16%,rgba(18,18,21,.9)),rgba(16,16,18,.86) 55%);border:1px solid color-mix(in srgb,var(--a) 28%,transparent);backdrop-filter:blur(18px);cursor:pointer;transition:transform .25s cubic-bezier(.23,1,.32,1),box-shadow .25s}
.s3 .hd{display:flex;align-items:center;gap:12px}
.s3 .ic{width:46px;height:46px;border-radius:13px;font-size:18px}.s3 h3{margin:0;font-size:16.5px}.s3 .ow{color:var(--dim);font-size:12.5px}
.s3 .mid{display:flex;align-items:center;gap:18px;margin:18px 0 16px}
.s3 .ring{--p:0;width:92px;height:92px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--a) calc(var(--p)*1%),rgba(255,255,255,.08) 0);-webkit-mask:radial-gradient(farthest-side,transparent 78%,#000 79%);mask:radial-gradient(farthest-side,transparent 78%,#000 79%)}
.s3 .rw{position:relative;width:92px;height:92px;flex:none}.s3 .rw b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-weight:700;line-height:1}
.s3 .rw b small{display:block;font-size:11px;font-weight:500;color:var(--dim);margin-top:2px;text-align:center}
.s3 p{margin:0;color:#C9CDD3;font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.s3 .ac{display:flex;gap:8px}.s3 .ac .pri{flex:1}
.s3:hover,.s3.h{transform:translateY(-3px);box-shadow:0 20px 44px -16px color-mix(in srgb,var(--a) 45%,transparent)}

/* ── 4. Spotlight ── */
.s4{position:relative;padding:1px;border-radius:18px;background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--a) 85%,#fff),rgba(255,255,255,.08) 45%);cursor:pointer;transition:transform .25s cubic-bezier(.23,1,.32,1)}
.s4 .in{position:relative;height:100%;padding:18px;border-radius:17px;background:radial-gradient(500px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--a) 14%,transparent),transparent 45%),#121316;overflow:hidden}
.s4 .hd{display:flex;align-items:center;gap:12px}.s4 .ic{width:48px;height:48px;border-radius:14px;font-size:19px}
.s4 h3{margin:0;font-size:16.5px}.s4 .ow{color:var(--dim);font-size:12.5px}
.s4 p{color:#C9CDD3;font-size:13.5px;margin:12px 0}
.s4 .st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.s4 .st div{padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.035);border:1px solid var(--hair)}
.s4 .st small{display:block;color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}.s4 .st b{font-size:14px}
.s4 .ac{display:flex;gap:8px}
.s4:hover,.s4.h{transform:translateY(-3px)}

/* ── 5. Discovery rows ── */
.list{display:flex;flex-direction:column;gap:10px}
.s5{display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:16px;background:var(--panel);border:1px solid var(--hair);backdrop-filter:blur(18px);cursor:pointer;transition:background .2s,border-color .2s,transform .2s cubic-bezier(.23,1,.32,1)}
.s5 .ic{width:56px;height:56px;border-radius:15px;font-size:22px}
.s5 .tx{flex:1;min-width:0}.s5 h3{margin:0 0 2px;font-size:16px;display:flex;align-items:center;gap:8px}.s5 h3 .tg{font-size:11px;font-weight:500;color:var(--dim);border:1px solid var(--hair2);border-radius:999px;padding:1px 8px}
.s5 p{margin:0;color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s5 .pl{width:150px;flex:none}.s5 .pl .bar{height:5px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}.s5 .pl .bar i{display:block;height:100%;background:var(--ok);border-radius:inherit}.full.s5 .pl .bar i{background:var(--warn)}
.s5 .ac{display:flex;gap:8px;flex:none}
.s5 .ch{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--hair2);color:var(--dim);transition:transform .2s,background .2s,color .2s}
.s5:hover,.s5.h{background:rgba(26,27,31,.9);border-color:rgba(240,242,245,.18);transform:translateX(3px)}
.s5:hover .ch,.s5.h .ch{background:var(--ink);color:#0B0B0C;transform:translateX(2px)}

/* ── 6. Featured + compact ── */
.g6{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:auto auto;gap:16px}
.feat{grid-row:span 2;position:relative;min-height:380px;border-radius:22px;overflow:hidden;cursor:pointer;background:url(liberty-county.jpg) var(--pos)/500% no-repeat;border:1px solid var(--hair2);transition:transform .3s cubic-bezier(.23,1,.32,1)}
.feat::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,8,10,.94) 0%,rgba(6,8,10,.7) 45%,rgba(6,8,10,.1) 100%)}
.feat .in{position:absolute;inset:0;padding:28px;display:flex;flex-direction:column;justify-content:flex-end;max-width:520px}
.feat .badge{align-self:flex-start;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:rgba(240,242,245,.12);margin-bottom:auto}
.feat .ic{width:64px;height:64px;border-radius:17px;font-size:26px;margin-bottom:14px}
.feat h3{margin:0 0 6px;font-size:30px;letter-spacing:-.02em}.feat p{margin:0 0 16px;color:#D5D8DD;font-size:14.5px}
.feat .ac{display:flex;gap:10px;align-items:center}.feat .ac .btn{padding:10px 18px;font-size:13.5px}
.feat:hover,.feat.h{transform:scale(1.005)}
.c6{display:flex;gap:14px;align-items:center;padding:16px;border-radius:18px;background:var(--panel);border:1px solid var(--hair);backdrop-filter:blur(18px);cursor:pointer;transition:transform .25s cubic-bezier(.23,1,.32,1),border-color .2s}
.c6 .ic{width:52px;height:52px;border-radius:14px;font-size:20px}.c6 h3{margin:0 0 3px;font-size:15.5px}.c6 p{margin:0 0 8px;color:var(--dim);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c6:hover,.c6.h{transform:translateY(-3px);border-color:rgba(240,242,245,.2)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><div class="bg"></div>
<div id="root"></div>
<script>
const S = [
  { name: 'Liberty County RP', owner: '22hype22', bio: 'Serious roleplay since 2023. Whitelisted departments, active staff and weekly events. Read the rules in our Discord before joining.', players: 27, max: 40, code: 'LCRPx', invite: 1, a: '#4C8DFF', g: 'linear-gradient(140deg,#4C8DFF,#1C3E86)', pos: '38% 62%', tags: ['Verified accounts', 'Team balance', '3 departments'] },
  { name: 'Springfield State RP', owner: 'cone_daddy', bio: 'Full server with a queue most evenings. Strict FRP rules and a big fire department.', players: 40, max: 40, code: 'SPRFLD', invite: 1, a: '#E24B4B', g: 'linear-gradient(140deg,#E24B4B,#7A1F2C)', pos: '70% 30%', tags: ['Phone/ID verified', '3 departments'] },
  { name: 'River City Roleplay', owner: 'marlowe_j', bio: 'Chill community, great for new players. Police, fire and DOT are always hiring.', players: 12, max: 30, code: 'RIVERc', invite: 1, a: '#E9C24C', g: 'linear-gradient(140deg,#E9C24C,#8A5A12)', pos: '22% 30%', tags: ['Beginner friendly', '3 departments'] },
];
const e = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DC = '<svg class="dcI" viewBox="0 0 24 24" fill="currentColor"><path d="M19.6 5.4A17 17 0 0 0 15.4 4l-.5 1a15.6 15.6 0 0 0-5.8 0L8.6 4a17 17 0 0 0-4.2 1.4C1.8 9.4 1 13.3 1.4 17.1A17 17 0 0 0 6.6 20l1.1-1.8c-.6-.2-1.2-.5-1.7-.9l.4-.3a12.2 12.2 0 0 0 11.2 0l.4.3c-.5.4-1.1.7-1.7.9l1.1 1.8a17 17 0 0 0 5.2-2.9c.5-4.4-.8-8.3-2.9-11.7zM8.7 14.8c-1 0-1.9-1-1.9-2.1s.8-2.1 1.9-2.1 1.9 1 1.9 2.1-.8 2.1-1.9 2.1zm6.6 0c-1 0-1.9-1-1.9-2.1s.8-2.1 1.9-2.1 1.9 1 1.9 2.1-.8 2.1-1.9 2.1z"/></svg>';
const icon = s => `<span class="ic" style="background:${s.g}">${e(s.name[0])}</span>`;
const full = s => s.players >= s.max;
const live = s => `<span class="live"><i></i>${full(s) ? 'Full · ' + s.players + '/' + s.max : s.players + ' playing'}</span>`;
const v = (n, name, desc, html) => `<section><h2 class="v">${n}. ${name} <span>Option ${n}</span></h2><p class="vd">${desc}</p>${html}</section>`;
const cards = f => '<div class="grid">' + S.map((s, i) => f(s, i)).join('') + '</div>';
const st = (s, i) => `style="--a:${s.a};--pos:${s.pos}"` + (i === 0 ? ' data-h' : '');
let html = '';
html += v(1, 'Banner', 'Each card gets a cover cut from the Liberty County map, with the server icon overlapping it and a live player pill on top. Hover lifts the card and slowly zooms the cover.',
  cards((s, i) => `<article class="s1${full(s) ? ' full' : ''}${i === 0 ? ' h' : ''}" ${st(s, i)}><div class="bn">${live(s)}</div><div class="bd">${icon(s)}<h3>${e(s.name)}</h3><div class="ow">by ${e(s.owner)}</div><p>${e(s.bio)}</p><div class="ac"><span class="btn pri">View server</span><span class="btn dc">${DC}Discord</span></div></div></article>`));
html += v(2, 'Map tile', 'Big photo-style tiles: the whole card is a slice of the map with the name over a dark fade. Clean at rest; the buttons slide up on hover.',
  cards((s, i) => `<article class="s2${full(s) ? ' full' : ''}${i === 0 ? ' h' : ''}" ${st(s, i)}><div class="tp">${icon(s)}${live(s)}</div><div class="bt"><h3>${e(s.name)}</h3><p>${e(s.bio)}</p><div class="ac"><span class="btn pri">View server</span><span class="btn"><code>${e(s.code)}</code></span><span class="btn dc">${DC}</span></div></div></article>`));
html += v(3, 'Player ring', 'Built around how busy the server is: a big ring fills with the player count in the server\'s own colour, which also tints the card. Strong "Join" button.',
  cards((s, i) => `<article class="s3${full(s) ? ' full' : ''}${i === 0 ? ' h' : ''}" ${st(s, i)}><div class="hd">${icon(s)}<div><h3>${e(s.name)}</h3><div class="ow">by ${e(s.owner)}</div></div></div><div class="mid"><div class="rw"><div class="ring" style="--p:${Math.round(s.players / s.max * 100)}"></div><b><span>${s.players}<small>of ${s.max}</small></span></b></div><p>${e(s.bio)}</p></div><div class="ac"><span class="btn pri">${full(s) ? 'Join the queue' : 'Join now'}</span><span class="btn dc">${DC}</span></div></article>`));
html += v(4, 'Spotlight', 'A glowing edge in the server\'s colour that follows your mouse across the card, with quick stats tiles. Feels premium and interactive.',
  cards((s, i) => `<article class="s4${full(s) ? ' full' : ''}${i === 0 ? ' h' : ''}" ${st(s, i)}><div class="in"><div class="hd">${icon(s)}<div><h3>${e(s.name)}</h3><div class="ow">by ${e(s.owner)}</div></div></div><p>${e(s.bio)}</p><div class="st"><div><small>Playing</small><b>${s.players}/${s.max}</b></div><div><small>Join code</small><b>${e(s.code)}</b></div><div><small>Depts</small><b>3</b></div></div><div class="ac"><span class="btn pri">View server</span><span class="btn dc">${DC}Discord</span></div></div></article>`));
html += v(5, 'Discovery list', 'Wide rows like Discord\'s server discovery: easy to scan many servers at once, player bar on the right, the arrow fills in on hover.',
  '<div class="list">' + S.map((s, i) => `<article class="s5${full(s) ? ' full' : ''}${i === 0 ? ' h' : ''}" ${st(s, i)}>${icon(s)}<div class="tx"><h3>${e(s.name)}<span class="tg">${e(s.tags[0])}</span></h3><p>${e(s.bio)}</p></div><div class="pl">${live(s)}<div class="bar"><i style="width:${Math.round(s.players / s.max * 100)}%"></i></div></div><div class="ac"><span class="btn dc">${DC}</span><span class="ch">&rsaquo;</span></div></article>`).join('') + '</div>');
html += v(6, 'Featured + compact', 'The busiest server gets a big featured spot with a map backdrop; the rest sit beside it as compact cards. Gives the page a front-page feel.',
  `<div class="g6"><article class="feat${0 === 0 ? ' h' : ''}" ${st(S[0], 1)}><div class="in"><span class="badge">Most active</span>${icon(S[0])}<h3>${e(S[0].name)}</h3><p>${e(S[0].bio)}</p><div class="ac"><span class="btn pri">View server</span><span class="btn dc">${DC}Join Discord</span>${live(S[0])}</div></div></article>`
  + S.slice(1).map(s => `<article class="c6${full(s) ? ' full' : ''}" ${st(s, 1)}>${icon(s)}<div><h3>${e(s.name)}</h3><p>${e(s.bio)}</p>${live(s)}</div></article>`).join('') + '</div>');
document.getElementById('root').innerHTML = html;
// option 4: the glow follows the pointer
document.querySelectorAll('.s4').forEach(c => { c.addEventListener('pointermove', ev => { const r = c.getBoundingClientRect(); c.style.setProperty('--mx', (ev.clientX - r.left) + 'px'); c.style.setProperty('--my', (ev.clientY - r.top) + 'px'); }); });
const f4 = document.querySelector('.s4.h'); if (f4) { f4.style.setProperty('--mx', '30%'); f4.style.setProperty('--my', '10%'); }
</script></body></html>
